name: CI

# Se ejecuta en cada push y pull request. Las pruebas no necesitan RabbitMQ ni credenciales:
# levantan los 7 microservicios con bases de datos temporales y notificaciones en modo simulado.
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · microservicios (pruebas unitarias e integración)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test

  frontend:
    name: Frontend · pruebas y build de producción
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  docker:
    name: Docker · imágenes del backend y frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t detritus-backend ./backend
      - run: docker build -t detritus-frontend .
      - run: docker compose config --quiet
