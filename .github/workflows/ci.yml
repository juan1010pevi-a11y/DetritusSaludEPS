name: CI

# Se ejecuta en cada push y pull request. Las pruebas no necesitan RabbitMQ ni credenciales:
# levantan los 7 microservicios con bases de datos temporales y notificaciones en modo simulado.
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · microservicios (pruebas unitarias e integración)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test

  frontend:
    name: Frontend · pruebas y build de producción
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  docker:
    name: Docker · imágenes del backend y frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t detritus-backend ./backend
      - run: docker build -t detritus-frontend .
      - run: docker build -f deploy/Dockerfile -t detritus-web .   # imagen de despliegue (Render)
      # Los secretos son obligatorios en docker-compose: para validar el archivo se usan valores de prueba.
      - run: docker compose config --quiet
        env:
          AUTH_SECRET: ci-only-auth-secret-0123456789abcdef0123456789
          INTERNAL_KEY: ci-only-internal-key-0123456789abcdef012345678
          DATA_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
          RABBITMQ_USER: ci
          RABBITMQ_PASS: ci-password
      # Vulnerabilidades ALTAS o CRÍTICAS en las imágenes construidas.
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: detritus-backend
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: detritus-frontend
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  security:
    name: Seguridad · secretos y dependencias
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0              # todo el historial: busca secretos también en commits viejos
      - name: Secretos en el repositorio (Gitleaks)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Dependencias vulnerables · frontend
        run: npm audit --audit-level=high --omit=dev
      - name: Dependencias vulnerables · backend
        run: npm --prefix backend audit --audit-level=high --omit=dev
      - name: Archivos sensibles que nunca deben estar en Git
        run: |
          found=$(git ls-files | grep -E '(^|/)\.env$|\.sqlite$|\.dev-secrets\.json$|\.key$|\.pem$' || true)
          if [ -n "$found" ]; then echo "Archivos sensibles versionados:"; echo "$found"; exit 1; fi
