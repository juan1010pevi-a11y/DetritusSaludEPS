name: CodeQL (análisis estático de seguridad)

# SAST: busca vulnerabilidades en el código JavaScript (inyecciones, XSS, secretos, rutas inseguras…).
on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: '23 6 * * 1'   # cada lunes
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v3
