# Nginx: punto de entrada público de Detritus Salud EPS.
#  - HTTPS (TLS 1.2/1.3) y redirección de HTTP a HTTPS.
#  - Sirve el frontend ya compilado (dist/) y reenvía /api al API Gateway por la red interna.
#  - Cabeceras de seguridad (CSP, HSTS, X-Frame-Options…).
# Corre como usuario sin privilegios (imagen nginx-unprivileged), por eso usa los puertos 8080/8443.

server_tokens off;
client_max_body_size 2m;
limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=20r/s;

server {
  listen 8080;
  server_name _;
  return 301 https://$host:8443$request_uri;
}

server {
  listen 8443 ssl;
  http2 on;
  server_name _;

  ssl_certificate     /etc/nginx/certs/tls.crt;
  ssl_certificate_key /etc/nginx/certs/tls.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:10m;
  ssl_session_tickets off;

  root /usr/share/nginx/html;
  index index.html;

  # ---- Cabeceras de seguridad del sitio ----
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  # CSP: solo scripts propios (y hCaptcha si se activa); estilos propios y Google Fonts; sin <object>; sin ser enmarcado.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://js.hcaptcha.com https://*.hcaptcha.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://*.hcaptcha.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://*.hcaptcha.com; frame-src https://*.hcaptcha.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;

  # ---- API: al gateway por la red interna de Docker ----
  location /api/ {
    limit_req zone=api_per_ip burst=40 nodelay;
    proxy_pass http://gateway:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;   # el gateway confía solo en este valor (TRUST_PROXY=1)
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 30s;
    proxy_hide_header X-Powered-By;
  }

  # ---- Frontend (SPA) ----
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  location / {
    try_files $uri /index.html;
  }

  # Nunca servir archivos ocultos (.env, .git…) ni mapas de código.
  location ~ /\. { deny all; return 404; }
  location ~ \.map$ { deny all; return 404; }
}
